[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spot-voice"
version = "1.0.0"
description = "Voice-commanded AI control of a Boston Dynamics Spot for facility inspection."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
spot-voice = "spot_voice.main:main"

[tool.setuptools]
packages = [
    "spot_voice",
    "spot_voice.audio",
    "spot_voice.brain",
    "spot_voice.robot",
    "spot_voice.safety",
    "spot_voice.tts",
]

[tool.setuptools.package-data]
"spot_voice.assets" = ["*.jpg"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
